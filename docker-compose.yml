services:
  frontend:
    image: huy210205/scc-sis-fe:huy2.5
    container_name: scc-sis-fe
    environment:
      TZ: "Asia/Ho_Chi_Minh"
    ports:
      - "5173:80"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      - scc-sis-network
    restart: unless-stopped

networks:
  scc-sis-network:
    name: scc-sis-network
    external: true
